  <!-- Error catcher: show loading until React paints, catch script errors -->
  <script>
    document.getElementById('root').innerHTML = '<div id="loading-indicator" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace;color:var(--fg-faint,#888);font-size:14px;letter-spacing:0.05em;">Loading...</div>';
    window.addEventListener('error', function(e) {
      if (!e.message || e.message === 'undefined' || e.message === 'Script error.') {
        console.warn('Benign error ignored:', e.message, e.filename);
        return;
      }
      console.error('JS Error:', e.message, e.filename, e.lineno, e.error && e.error.stack);
      var root = document.getElementById('root');
      var loading = document.getElementById('loading-indicator');
      if (root && loading && root.contains(loading)) {
        var box = document.createElement('div');
        box.setAttribute('style', 'padding:40px;font-family:monospace;color:#a00;background:#fff3f3;font-size:13px;white-space:pre-wrap;border-left:4px solid #a00;margin:20px;border-radius:8px;');
        var heading = document.createElement('b');
        heading.setAttribute('style', 'font-size:16px;');
        heading.textContent = 'JS Error';
        box.appendChild(heading);
        // textContent prevents any error string / filename from being parsed as HTML
        box.appendChild(document.createTextNode(
          '\n\n' + e.message + '\nLine: ' + e.lineno + ', Col: ' + e.colno +
          '\nFile: ' + e.filename + '\n\n' + (e.error && e.error.stack ? e.error.stack : '')
        ));
        root.innerHTML = '';
        root.appendChild(box);
      }
    }, true);
  </script>
